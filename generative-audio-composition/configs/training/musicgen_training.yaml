training:
  experiment_name: musicgen_finetune_v1
  seed: 42

  data:
    train_datasets: [fma_large, musdb18, jamendo]
    val_split: 0.02
    batch_size: 8
    num_workers: 8
    segment_duration: 30.0

  optimizer:
    name: adamw
    lr: 1.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.1

  scheduler:
    name: cosine_with_warmup
    warmup_steps: 1000
    total_steps: 100000

  training:
    max_steps: 100000
    gradient_clip: 1.0
    gradient_accumulation: 8
    precision: bf16

  checkpoint:
    save_every_n_steps: 2500
    keep_last_k: 3

  hardware:
    num_gpus: 8
    strategy: fsdp
