# DiffSinger SVS Model Configuration
model:
  name: diffsinger
  version: "1.0"

  # Text/Phoneme Encoder (FastSpeech2-based)
  encoder:
    hidden_dim: 256
    num_layers: 4
    num_heads: 2
    kernel_size: 9
    dropout: 0.1
    ffn_dim: 1024
    vocab_size: 100  # IPA phoneme set
    max_seq_len: 2000

  # Variance Adaptor
  variance_adaptor:
    duration_predictor:
      hidden_dim: 256
      num_layers: 2
      kernel_size: 3
      dropout: 0.1
    pitch_predictor:
      hidden_dim: 256
      num_layers: 5
      kernel_size: 5
      dropout: 0.1
      pitch_min: 50.0
      pitch_max: 1100.0
      pitch_bins: 300
    energy_predictor:
      hidden_dim: 256
      num_layers: 2
      kernel_size: 3
      dropout: 0.1

  # Diffusion Decoder
  decoder:
    residual_channels: 256
    residual_layers: 20
    dilation_cycle_length: 4
    timesteps: 1000
    noise_schedule: linear
    beta_start: 0.0001
    beta_end: 0.06
    # Inference
    inference_timesteps: 50

  # Speaker Encoder integration
  speaker:
    embedding_dim: 256
    use_speaker_condition: true
    speaker_condition_layers: [0, 2, 4, 6, 8, 10]

  # Mel spectrogram
  audio:
    sample_rate: 44100
    hop_length: 512
    win_length: 2048
    n_fft: 2048
    n_mels: 128
    fmin: 0
    fmax: 22050

  # HiFi-GAN Vocoder
  vocoder:
    upsample_rates: [8, 8, 4, 2]
    upsample_kernel_sizes: [16, 16, 8, 4]
    upsample_initial_channel: 512
    resblock_kernel_sizes: [3, 7, 11]
    resblock_dilation_sizes: [[1, 3, 5], [1, 3, 5], [1, 3, 5]]
