version: "3.9"

# ── Shared environment variables ──────────────────────────────────────────────
x-common-env: &common-env
  REDIS_URL: "redis://redis:6379/0"
  UPLOAD_DIR: "/app/uploads"
  OUTPUT_DIR: "/app/outputs"
  MODELS_DIR: "/app/models"
  PYTHONUNBUFFERED: "1"
  TOKENIZERS_PARALLELISM: "false"

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  models:
    driver: local
  outputs:
    driver: local
  uploads:
    driver: local
  redis_data:
    driver: local

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  backend:
    driver: bridge

services:
  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: audio_redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - backend
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── API ────────────────────────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: audio_api
    restart: unless-stopped
    environment:
      <<: *common-env
      REQUIRE_GPU: "false"
      # Increase to allow larger total upload sizes (bytes)
      MAX_UPLOAD_SIZE_BYTES: "524288000"  # 500 MB
    volumes:
      - models:/app/models
      - outputs:/app/outputs
      - uploads:/app/uploads
    networks:
      - backend
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Celery worker ──────────────────────────────────────────────────────────
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: audio_worker
    restart: unless-stopped
    environment:
      <<: *common-env
      REQUIRE_GPU: "true"
      TORCH_DEVICE: "cuda"
      # WavLM / HuggingFace cache
      TRANSFORMERS_CACHE: "/app/models/hf_cache"
      HF_HOME: "/app/models/hf_cache"
      # Set to 1 to enable detailed CUDA error messages during development
      CUDA_LAUNCH_BLOCKING: "0"
    volumes:
      - models:/app/models
      - outputs:/app/outputs
      - uploads:/app/uploads
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy
    # GPU access: requires nvidia-container-toolkit on the host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test:
        - "CMD-SHELL"
        - "celery -A api.workers.tasks inspect ping -d celery@$$HOSTNAME || exit 1"
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s

  # ── Nginx reverse proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: audio_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Mount TLS certificates here in production:
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - backend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
