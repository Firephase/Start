{% extends 'base.html' %}
{% block title %}Вход — Сапёр{% endblock %}
{% block content %}
<div class="page-center">
  <div class="card" style="width:100%; max-width:400px;">
    <div style="text-align:center; margin-bottom:28px;">
      <div style="font-size:3rem; margin-bottom:8px;">💣</div>
      <h2 style="font-size:1.5rem; font-weight:700;">Вход в систему</h2>
    </div>
    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}
    <form method="POST">
      <div class="form-group">
        <label>Имя пользователя</label>
        <input class="form-control" type="text" name="username" autofocus autocomplete="username" required>
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input class="form-control" type="password" name="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%; justify-content:center; padding:12px; font-size:1rem; margin-top:8px;">
        Войти
      </button>
    </form>
    <p style="text-align:center; margin-top:20px; color:var(--text2); font-size:0.9rem;">
      Нет аккаунта? <a href="/register" style="color:var(--accent);">Зарегистрироваться</a>
    </p>
  </div>
</div>
{% endblock %}
