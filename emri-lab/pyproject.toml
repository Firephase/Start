[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emri_lab"
version = "0.1.0"
description = "EMRI production simulation lab — adiabatic inspiral in (p,e) space"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "streamlit>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["slow: marks tests as slow (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = false
